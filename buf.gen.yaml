version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/DmytroLysenko1/faultline/internal/gen/proto
plugins:
  - local: ["go", "tool", "protoc-gen-go"]
    out: internal/gen/proto
    opt: paths=source_relative
  - local: ["go", "tool", "protoc-gen-connect-go"]
    out: internal/gen/proto
    opt: paths=source_relative
