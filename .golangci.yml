version: "2"

run:
  go: "1.27"
  timeout: 5m

linters:
  default: none
  enable:
    # --- context correctness (the doctrine's "context — закон", deterministic) ---
    - contextcheck    # a function must propagate the parent ctx, not break the chain
    - containedctx    # no context.Context stored inside a struct field
    - fatcontext      # no context created/derived inside a loop body (leak + perf)
    - noctx           # no HTTP/SQL call without a ctx-carrying variant
    # govet below includes `lostcancel`: WithCancel/WithTimeout whose cancel() is never called

    # --- resource & goroutine leaks ---
    - bodyclose       # http.Response.Body always closed
    - rowserrcheck    # sql.Rows.Err() checked
    - sqlclosecheck   # sql.Rows/Stmt closed
    - makezero        # append to a make([]T, n) slice (silent zero-value bug)
    # goroutine leaks are NOT a linter — enforce with goleak.VerifyTestMain in tests
    # (see CLAUDE.md TESTING). No static linter catches a leaked goroutine.

    # --- error discipline (stdlib errors, %w, sentinel) ---
    - errcheck        # no ignored errors
    - errorlint       # %w wrapping, errors.Is/As over == / type assertion
    - nilerr          # `if err != nil { return nil }` — swallowed error
    - err113          # dynamic errors via errors.New at call site (allow-list %w wraps)

    # --- correctness / dead code / perf ---
    - govet           # includes lostcancel, copylocks, loopclosure, printf, ...
    - staticcheck
    - ineffassign
    - unused
    - unparam
    - wastedassign
    - prealloc
    - unconvert
    - copyloopvar
    - gocritic

    # --- function budgets: at most 30 lines, complexity at most 5, lines at most 128 characters ---
    - funlen
    - gocyclo
    - gocognit
    - lll

    # --- security & hygiene ---
    - gosec
    - forbidigo       # ban fmt.Print*/log.* — structured logging only
    - depguard        # ban archived/forbidden deps
    - misspell
    - mnd             # no magic numbers in production code

  settings:
    funlen:
      lines: 30
      statements: -1
    gocyclo:
      min-complexity: 5
    gocognit:
      min-complexity: 5
    lll:
      line-length: 128
      tab-width: 4
    depguard:
      rules:
        main:
          deny:
            - pkg: github.com/pkg/errors
              desc: archived since 2021 — use stdlib errors
            - pkg: github.com/stretchr/testify
              desc: stdlib testing + go-cmp only
            - pkg: github.com/onsi/ginkgo
              desc: stdlib testing only
            - pkg: github.com/onsi/gomega
              desc: stdlib testing only
        # Layer rules (NFR-MAINT-002, CLAUDE.md "Правила зависимостей").
        layer-domain:
          files:
            - "**/internal/domain/**"
          deny:
            - pkg: github.com/DmytroLysenko1/faultline/internal/application
              desc: domain imports nothing from other layers
            - pkg: github.com/DmytroLysenko1/faultline/internal/infrastructure
              desc: domain imports nothing from other layers
            - pkg: github.com/DmytroLysenko1/faultline/internal/interfaces
              desc: domain imports nothing from other layers
            - pkg: github.com/DmytroLysenko1/faultline/internal/gen
              desc: wire types stay in interfaces
            - pkg: github.com/DmytroLysenko1/faultline/internal/cli
              desc: domain imports nothing from other layers
            - pkg: google.golang.org/grpc
              desc: transport stays in interfaces
            - pkg: google.golang.org/protobuf
              desc: wire types stay in interfaces
            - pkg: connectrpc.com
              desc: transport stays in interfaces
            - pkg: go.opentelemetry.io
              desc: OTLP/pdata types stay in interfaces; self-tracing lives in infrastructure/selftrace and the API adapter
        # pkg holds reusable engines without business logic; the domain may use them, they never see internal.
        pkg-pure:
          files:
            - "**/pkg/**"
          deny:
            - pkg: github.com/DmytroLysenko1/faultline/internal
              desc: pkg is reusable and knows nothing of faultline's layers
        layer-application:
          files:
            - "**/internal/application/**"
          deny:
            - pkg: github.com/DmytroLysenko1/faultline/internal/infrastructure
              desc: application depends on consumer-side ports, not adapters
            - pkg: github.com/DmytroLysenko1/faultline/internal/interfaces
              desc: application never calls driving adapters
            - pkg: github.com/DmytroLysenko1/faultline/internal/gen
              desc: wire types stay in interfaces
            - pkg: github.com/DmytroLysenko1/faultline/internal/cli
              desc: application never calls driving adapters
            - pkg: google.golang.org/grpc
              desc: transport stays in interfaces
            - pkg: google.golang.org/protobuf
              desc: wire types stay in interfaces
            - pkg: connectrpc.com
              desc: transport stays in interfaces
            - pkg: go.opentelemetry.io/collector
              desc: pdata stays in interfaces/otlp
            - pkg: github.com/DmytroLysenko1/faultline/internal/domain/topology/matcher
              desc: only topology.Builder keeps the expire → match → apply order (I1, I3)
            - pkg: github.com/DmytroLysenko1/faultline/internal/domain/topology/graph
              desc: only topology.Builder keeps the expire → match → apply order (I1, I3)
            - pkg: github.com/DmytroLysenko1/faultline/internal/domain/topology/tombstone
              desc: only topology.Builder keeps the expire → match → apply order (I1, I3)
            - pkg: github.com/DmytroLysenko1/faultline/internal/domain/topology/clock
              desc: only topology.Builder keeps the expire → match → apply order (I1, I3)
            - pkg: github.com/DmytroLysenko1/faultline/internal/domain/topology/traffic
              desc: application drives RED through topology.Builder; traffic, red, cardinality and handle stay inside it
            - pkg: github.com/DmytroLysenko1/faultline/internal/domain/topology/red
              desc: application drives RED through topology.Builder; traffic, red, cardinality and handle stay inside it
            - pkg: github.com/DmytroLysenko1/faultline/internal/domain/topology/cardinality
              desc: application drives RED through topology.Builder; traffic, red, cardinality and handle stay inside it
            - pkg: github.com/DmytroLysenko1/faultline/internal/domain/topology/handle
              desc: application drives RED through topology.Builder; traffic, red, cardinality and handle stay inside it
            - pkg: github.com/DmytroLysenko1/faultline/pkg/stream
              desc: application drives RED through topology.Builder; the window and sketch engines stay in the domain
            - pkg: github.com/DmytroLysenko1/faultline/pkg/sketch
              desc: application drives RED through topology.Builder; the window and sketch engines stay in the domain
        # Step 2: operation limits and RED cells sit below matcher, graph and traffic.
        topology-lower-layers:
          files:
            - "**/internal/domain/topology/cardinality/**"
            - "**/internal/domain/topology/red/**"
          deny:
            - pkg: github.com/DmytroLysenko1/faultline/internal/domain/topology/graph
              desc: cardinality and red sit below matcher, graph and traffic
            - pkg: github.com/DmytroLysenko1/faultline/internal/domain/topology/traffic
              desc: cardinality and red sit below matcher, graph and traffic
            - pkg: github.com/DmytroLysenko1/faultline/internal/domain/topology/matcher
              desc: cardinality and red sit below matcher, graph and traffic
        # Spans on the ingest path would loop back through a Collector into faultline (step 1, slice 5b-3, D6).
        no-self-tracing-on-ingest:
          files:
            - "**/internal/application/**"
            - "**/internal/interfaces/otlp/**"
            - "**/internal/infrastructure/memjournal/**"
            - "**/internal/infrastructure/memgraph/**"
            - "**/internal/infrastructure/natsjs/**"
          deny:
            - pkg: go.opentelemetry.io/otel
              desc: the ingest and processing path is never traced
            - pkg: go.opentelemetry.io/contrib
              desc: the ingest and processing path is never traced
            - pkg: connectrpc.com/otelconnect
              desc: the ingest and processing path is never traced
        natsjs-record-pure:
          files:
            - "**/internal/infrastructure/natsjs/record/**"
            - "!$test"
          deny:
            - pkg: github.com/nats-io
              desc: the record format has no transport — nats.go stays in natsjs and natsjs/journal
            - pkg: github.com/DmytroLysenko1/faultline/internal/application
              desc: the record format depends only on domain telemetry types
            - pkg: github.com/DmytroLysenko1/faultline/internal/domain/topology
              desc: the record format depends only on domain telemetry types
            - pkg: github.com/DmytroLysenko1/faultline/internal/infrastructure
              desc: the record format is the leaf of natsjs; adapters import it, never the reverse
        layer-infrastructure:
          files:
            - "**/internal/infrastructure/**"
          deny:
            - pkg: github.com/DmytroLysenko1/faultline/internal/interfaces
              desc: adapters do not call driving adapters
            - pkg: github.com/DmytroLysenko1/faultline/internal/cli
              desc: adapters do not call driving adapters
        layer-interfaces:
          files:
            - "**/internal/interfaces/**"
          deny:
            - pkg: github.com/DmytroLysenko1/faultline/internal/infrastructure
              desc: driving adapters call application only; wiring lives in cmd/
        # faultctl is a network client of the API: it sees only generated wire types.
        layer-cli:
          files:
            - "**/internal/cli/**"
          deny:
            - pkg: github.com/DmytroLysenko1/faultline/internal/domain
              desc: CLI talks to the server over the API, not to the domain
            - pkg: github.com/DmytroLysenko1/faultline/internal/application
              desc: CLI talks to the server over the API, not to use cases
            - pkg: github.com/DmytroLysenko1/faultline/internal/infrastructure
              desc: CLI talks to the server over the API, not to adapters
            - pkg: github.com/DmytroLysenko1/faultline/internal/interfaces
              desc: CLI is a separate binary; server adapters are not its dependency
        # Use cases do not import each other: shared rules belong in domain.
        usecase-ingest:
          files:
            - "**/internal/application/ingest/**"
          deny:
            - pkg: github.com/DmytroLysenko1/faultline/internal/application/processing
              desc: use cases do not import each other — move shared code to domain
            - pkg: github.com/DmytroLysenko1/faultline/internal/application/query
              desc: use cases do not import each other — move shared code to domain
        usecase-processing:
          files:
            - "**/internal/application/processing/**"
          deny:
            - pkg: github.com/DmytroLysenko1/faultline/internal/application/ingest
              desc: use cases do not import each other — move shared code to domain
            - pkg: github.com/DmytroLysenko1/faultline/internal/application/query
              desc: use cases do not import each other — move shared code to domain
        usecase-query:
          files:
            - "**/internal/application/query/**"
          deny:
            - pkg: github.com/DmytroLysenko1/faultline/internal/application/ingest
              desc: use cases do not import each other — move shared code to domain
            - pkg: github.com/DmytroLysenko1/faultline/internal/application/processing
              desc: use cases do not import each other — move shared code to domain
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^topology\.Builder\.(Matcher|Graph|Traffic)$
          pkg: ^github\.com/DmytroLysenko1/faultline/internal/domain/topology$
          msg: only topology.Builder keeps the expire → match → apply → record order (I1, I3, I10)
        - pattern: ^batch\.(New|NewOwning|Heartbeat)$
          pkg: ^github\.com/DmytroLysenko1/faultline/internal/domain/telemetry/batch$
          msg: only memjournal stamps ReceivedAt and writes heartbeats — journal order is ReceivedAt order
        - pattern: ^fmt\.Print(|f|ln)$
          msg: no stdout printing — use slog/zap (observability doctrine)
        - pattern: ^log\.(Print|Fatal|Panic)(|f|ln)$
          msg: no stdlib log — errors flow up as values; log only at the final boundary
        - pattern: ^time\.(Now|Since|Until)$
          msg: inject a clock port — domain and application time must be deterministic
    gocritic:
      enabled-tags:
        - diagnostic
        - performance

  exclusions:
    generated: strict
    paths:
      - internal/gen
      - web
    rules:
      - path: internal/domain/topology/
        linters:
          - forbidigo
        text: only topology.Builder keeps the expire
      - path: (internal/infrastructure/memjournal/|internal/domain/telemetry/batch/|/[a-z]+test/|_test\.go$)
        linters:
          - forbidigo
        text: only memjournal stamps ReceivedAt
      - path-except: internal/(domain|application)/
        linters:
          - forbidigo
        text: inject a clock port
      # Tests build large table literals and helper closures; relax size/complexity/sec there.
      - path: _test\.go
        linters:
          - funlen
          - gocognit
          - gocyclo
          - prealloc
          - gosec
          - err113
          - mnd

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/DmytroLysenko1/faultline
