version: "2"

run:
  go: "1.27"
  timeout: 5m

linters:
  default: none
  enable:
    - contextcheck
    - containedctx
    - fatcontext
    - noctx

    - bodyclose
    - rowserrcheck
    - sqlclosecheck
    - makezero

    - errcheck
    - errorlint
    - nilerr
    - err113
    - errname
    - wrapcheck

    - govet
    - staticcheck
    - ineffassign
    - unused
    - unparam
    - wastedassign
    - prealloc
    - unconvert
    - copyloopvar
    - exhaustive
    - gocritic

    - funlen
    - gocyclo
    - gocognit
    - lll

    - gosec
    - forbidigo
    - depguard
    - misspell
    - mnd

  settings:
    wrapcheck:
      ignore-package-globs:
        - github.com/DmytroLysenko1/faultline/*
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - errors.Join(
        - .Wrap(
        - .Wrapf(
        - .WithMessage(
        - .WithMessagef(
        - .WithStack(
        - connect.NewError(
        - .Err() error
        - (io.Writer).Write(
        - (*bytes.Buffer).Write(
        - (*bufio.Writer).WriteString(
        - (*bufio.Writer).Flush(
        - fmt.Fprintf(
        - (io.Reader).Read(
        - io.ReadFull(
        - os.Stat(
        - os.Open(
        - os.ReadFile(
        - net.SplitHostPort(
        - (net/http.ResponseWriter).Write(
        - (*golang.org/x/sync/semaphore.Weighted).Acquire(
        - (google.golang.org/grpc/encoding.CodecV2).
        - github.com/nats-io/nats.go/jetstream.
    exhaustive:
      default-signifies-exhaustive: true
    funlen:
      lines: 30
      statements: -1
    gocyclo:
      min-complexity: 5
    gocognit:
      min-complexity: 5
    lll:
      line-length: 128
      tab-width: 4
    depguard:
      rules:
        main:
          deny:
            - pkg: github.com/pkg/errors
              desc: archived since 2021 — use stdlib errors
            - pkg: github.com/stretchr/testify
              desc: stdlib testing + go-cmp only
            - pkg: github.com/onsi/ginkgo
              desc: stdlib testing only
            - pkg: github.com/onsi/gomega
              desc: stdlib testing only
        layer-domain:
          files:
            - "**/internal/domain/**"
          deny:
            - pkg: github.com/DmytroLysenko1/faultline/internal/application
              desc: domain imports nothing from other layers
            - pkg: github.com/DmytroLysenko1/faultline/internal/infrastructure
              desc: domain imports nothing from other layers
            - pkg: github.com/DmytroLysenko1/faultline/internal/interfaces
              desc: domain imports nothing from other layers
            - pkg: github.com/DmytroLysenko1/faultline/internal/gen
              desc: wire types stay in interfaces
            - pkg: github.com/DmytroLysenko1/faultline/internal/cli
              desc: domain imports nothing from other layers
            - pkg: google.golang.org/grpc
              desc: transport stays in interfaces
            - pkg: google.golang.org/protobuf
              desc: wire types stay in interfaces
            - pkg: connectrpc.com
              desc: transport stays in interfaces
            - pkg: go.opentelemetry.io
              desc: OTLP/pdata types stay in interfaces; self-tracing lives in infrastructure/selftrace and the API adapter
        pkg-pure:
          files:
            - "**/pkg/**"
          deny:
            - pkg: github.com/DmytroLysenko1/faultline/internal
              desc: pkg is reusable and knows nothing of faultline's layers
        layer-application:
          files:
            - "**/internal/application/**"
          deny:
            - pkg: github.com/DmytroLysenko1/faultline/internal/infrastructure
              desc: application depends on consumer-side ports, not adapters
            - pkg: github.com/DmytroLysenko1/faultline/internal/interfaces
              desc: application never calls driving adapters
            - pkg: github.com/DmytroLysenko1/faultline/internal/gen
              desc: wire types stay in interfaces
            - pkg: github.com/DmytroLysenko1/faultline/internal/cli
              desc: application never calls driving adapters
            - pkg: google.golang.org/grpc
              desc: transport stays in interfaces
            - pkg: google.golang.org/protobuf
              desc: wire types stay in interfaces
            - pkg: connectrpc.com
              desc: transport stays in interfaces
            - pkg: go.opentelemetry.io/collector
              desc: pdata stays in interfaces/otlp
            - pkg: github.com/DmytroLysenko1/faultline/internal/domain/topology/matcher
              desc: only topology.Builder keeps the expire → match → apply order (I1, I3)
            - pkg: github.com/DmytroLysenko1/faultline/internal/domain/topology/graph
              desc: only topology.Builder keeps the expire → match → apply order (I1, I3)
            - pkg: github.com/DmytroLysenko1/faultline/internal/domain/topology/tombstone
              desc: only topology.Builder keeps the expire → match → apply order (I1, I3)
            - pkg: github.com/DmytroLysenko1/faultline/internal/domain/topology/clock
              desc: only topology.Builder keeps the expire → match → apply order (I1, I3)
            - pkg: github.com/DmytroLysenko1/faultline/internal/domain/topology/traffic
              desc: application drives RED through topology.Builder; traffic, red, cardinality and handle stay inside it
            - pkg: github.com/DmytroLysenko1/faultline/internal/domain/topology/red
              desc: application drives RED through topology.Builder; traffic, red, cardinality and handle stay inside it
            - pkg: github.com/DmytroLysenko1/faultline/internal/domain/topology/cardinality
              desc: application drives RED through topology.Builder; traffic, red, cardinality and handle stay inside it
            - pkg: github.com/DmytroLysenko1/faultline/internal/domain/topology/handle
              desc: application drives RED through topology.Builder; traffic, red, cardinality and handle stay inside it
            - pkg: github.com/DmytroLysenko1/faultline/pkg/stream
              desc: application drives RED through topology.Builder; the window and sketch engines stay in the domain
            - pkg: github.com/DmytroLysenko1/faultline/pkg/sketch
              desc: application drives RED through topology.Builder; the window and sketch engines stay in the domain
        topology-lower-layers:
          files:
            - "**/internal/domain/topology/cardinality/**"
            - "**/internal/domain/topology/red/**"
          deny:
            - pkg: github.com/DmytroLysenko1/faultline/internal/domain/topology/graph
              desc: cardinality and red sit below matcher, graph and traffic
            - pkg: github.com/DmytroLysenko1/faultline/internal/domain/topology/traffic
              desc: cardinality and red sit below matcher, graph and traffic
            - pkg: github.com/DmytroLysenko1/faultline/internal/domain/topology/matcher
              desc: cardinality and red sit below matcher, graph and traffic
        no-self-tracing-on-ingest:
          files:
            - "**/internal/application/**"
            - "**/internal/interfaces/otlp/**"
            - "**/internal/infrastructure/journaltest/**"
            - "**/internal/infrastructure/memgraph/**"
            - "**/internal/infrastructure/natsjs/**"
          deny:
            - pkg: go.opentelemetry.io/otel
              desc: the ingest and processing path is never traced
            - pkg: go.opentelemetry.io/contrib
              desc: the ingest and processing path is never traced
            - pkg: connectrpc.com/otelconnect
              desc: the ingest and processing path is never traced
        natsjs-record-pure:
          files:
            - "**/internal/infrastructure/natsjs/record/**"
            - "!$test"
          deny:
            - pkg: github.com/nats-io
              desc: the record format has no transport — nats.go stays in natsjs and natsjs/journal
            - pkg: github.com/DmytroLysenko1/faultline/internal/application
              desc: the record format depends only on domain telemetry types
            - pkg: github.com/DmytroLysenko1/faultline/internal/domain/topology
              desc: the record format depends only on domain telemetry types
            - pkg: github.com/DmytroLysenko1/faultline/internal/infrastructure
              desc: the record format is the leaf of natsjs; adapters import it, never the reverse
        natsjs-speaks-no-ingest:
          files:
            - "**/internal/infrastructure/natsjs/**"
            - "!**/internal/infrastructure/natsjs/journal/meaning.go"
            - "!**/internal/infrastructure/natsjs/journal/*_test.go"
          deny:
            - pkg: github.com/DmytroLysenko1/faultline/internal/application/ingest$
              desc: only natsjs/journal/meaning.go gives a failure its ingest meaning (toIngest)
        natsjs-speaks-no-tokens:
          files:
            - "**/internal/infrastructure/natsjs/**"
            - "!**/internal/infrastructure/natsjs/tokens/**"
          deny:
            - pkg: github.com/DmytroLysenko1/faultline/internal/application/tokenadmin
              desc: only natsjs/tokens stores ingest token grants
            - pkg: github.com/DmytroLysenko1/faultline/internal/application/ingestauth
              desc: only natsjs/tokens stores ingest token grants
            - pkg: github.com/DmytroLysenko1/faultline/internal/domain/credential
              desc: only natsjs/tokens stores ingest token grants
        nats-stays-in-natsjs:
          files:
            - "**/internal/**"
            - "**/pkg/**"
            - "!**/internal/infrastructure/natsjs/**"
            - "!$test"
          deny:
            - pkg: github.com/nats-io
              desc: NATS types stay in natsjs, cmd and tests (I16)
        nats-server-is-a-test-harness:
          files:
            - "$all"
            - "!**/internal/infrastructure/natsjs/natsjstest/**"
            - "!$test"
          deny:
            - pkg: github.com/nats-io/nats-server
              desc: the embedded NATS server runs only inside tests (natsjstest)
            - pkg: github.com/DmytroLysenko1/faultline/internal/infrastructure/natsjs/natsjstest
              desc: the test harness would pull the embedded NATS server into the binary
        test-harness-stays-in-tests:
          files:
            - "$all"
            - "!$test"
            - "!**/internal/**/*test/**"
            - "!**/test/**"
          deny:
            - pkg: github.com/DmytroLysenko1/faultline/internal/application/processing/processingtest
              desc: test harnesses stay in tests
            - pkg: github.com/DmytroLysenko1/faultline/internal/infrastructure/journaltest
              desc: test harnesses stay in tests
            - pkg: github.com/DmytroLysenko1/faultline/internal/domain/telemetry/telemetrytest
              desc: test harnesses stay in tests
            - pkg: github.com/DmytroLysenko1/faultline/internal/domain/topology/topologytest
              desc: test harnesses stay in tests
            - pkg: github.com/DmytroLysenko1/faultline/internal/interfaces/otlp/otlptest
              desc: test harnesses stay in tests
        credential-is-a-stdlib-leaf:
          list-mode: strict
          files:
            - "**/internal/domain/credential/**"
            - "!$test"
          allow:
            - $gostd
        tokenadmin-knows-only-credential:
          list-mode: strict
          files:
            - "**/internal/application/tokenadmin/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/DmytroLysenko1/faultline/internal/domain/credential
        ingestauth-knows-only-credential:
          list-mode: strict
          files:
            - "**/internal/application/ingestauth/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/DmytroLysenko1/faultline/internal/domain/credential
        tokens-never-use-math-rand:
          files:
            - "**/internal/domain/credential/**"
            - "**/internal/application/tokenadmin/**"
          deny:
            - pkg: math/rand
              desc: ingest token secrets come only from the injected crypto/rand reader (A10)
        otlp-guards:
          files:
            - "**/internal/interfaces/otlp/admission/**"
            - "!$test"
          deny:
            - pkg: google.golang.org/grpc
              desc: admission is transport-independent — OTLP/gRPC and OTLP/HTTP both call Gate.Enter
            - pkg: net/http
              desc: admission is transport-independent — OTLP/gRPC and OTLP/HTTP both call Gate.Enter
            - pkg: github.com/DmytroLysenko1/faultline/internal/application
              desc: admission keys on a credential.ID; the authenticator stays behind the tap
            - pkg: github.com/DmytroLysenko1/faultline/internal/interfaces/otlp$
              desc: the receiver imports admission, never the reverse
        layer-infrastructure:
          files:
            - "**/internal/infrastructure/**"
          deny:
            - pkg: github.com/DmytroLysenko1/faultline/internal/interfaces
              desc: adapters do not call driving adapters
            - pkg: github.com/DmytroLysenko1/faultline/internal/cli
              desc: adapters do not call driving adapters
        layer-interfaces:
          files:
            - "**/internal/interfaces/**"
          deny:
            - pkg: github.com/DmytroLysenko1/faultline/internal/infrastructure
              desc: driving adapters call application only; wiring lives in cmd/
        layer-cli:
          files:
            - "**/internal/cli/**"
          deny:
            - pkg: github.com/DmytroLysenko1/faultline/internal/domain
              desc: CLI talks to the server over the API, not to the domain
            - pkg: github.com/DmytroLysenko1/faultline/internal/application
              desc: CLI talks to the server over the API, not to use cases
            - pkg: github.com/DmytroLysenko1/faultline/internal/infrastructure
              desc: CLI talks to the server over the API, not to adapters
            - pkg: github.com/DmytroLysenko1/faultline/internal/interfaces
              desc: CLI is a separate binary; server adapters are not its dependency
        usecase-ingest:
          files:
            - "**/internal/application/ingest/**"
          deny:
            - pkg: github.com/DmytroLysenko1/faultline/internal/application/processing
              desc: use cases do not import each other — move shared code to domain
            - pkg: github.com/DmytroLysenko1/faultline/internal/application/query
              desc: use cases do not import each other — move shared code to domain
        usecase-processing:
          files:
            - "**/internal/application/processing/**"
          deny:
            - pkg: github.com/DmytroLysenko1/faultline/internal/application/ingest
              desc: use cases do not import each other — move shared code to domain
            - pkg: github.com/DmytroLysenko1/faultline/internal/application/query
              desc: use cases do not import each other — move shared code to domain
        usecase-query:
          files:
            - "**/internal/application/query/**"
          deny:
            - pkg: github.com/DmytroLysenko1/faultline/internal/application/ingest
              desc: use cases do not import each other — move shared code to domain
            - pkg: github.com/DmytroLysenko1/faultline/internal/application/processing
              desc: use cases do not import each other — move shared code to domain
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^topology\.Builder\.(Matcher|Graph|Traffic)$
          pkg: ^github\.com/DmytroLysenko1/faultline/internal/domain/topology$
          msg: only topology.Builder keeps the expire → match → apply → record order (I1, I3, I10)
        - pattern: ^batch\.(New|NewOwning|Heartbeat)$
          pkg: ^github\.com/DmytroLysenko1/faultline/internal/domain/telemetry/batch$
          msg: only the journals (journaltest, natsjs/feed) stamp ReceivedAt and make heartbeats — journal order is ReceivedAt order
        - pattern: ^checkpoint\.Err[A-Za-z]+$
          pkg: ^github\.com/DmytroLysenko1/faultline/internal/infrastructure/natsjs/checkpoint$
          msg: branch on processing.* — the checkpoint store translates its errors at its exit (docs/design/step-03-journal-and-reliable-ingest.md, slice natsjs/checkpoint)
        - pattern: ^jetstream\.Err[A-Z][A-Za-z]*$
          pkg: ^github\.com/nats-io/nats\.go/jetstream$
          msg: natsjs/tokens reads raw API codes and natsjs classes (Classify, WrongLastSequence, PurgeDenied), never client sentinels whose meaning shifts between nats.go versions
        - pattern: ^reflect\.DeepEqual$
          msg: digests and secrets compare only through Digest.Equal (constant time, A7)
        - pattern: ^credential\.Reveal$
          pkg: ^github\.com/DmytroLysenko1/faultline/internal/domain/credential$
          msg: only cmd/faultline/tokenoutput.go reveals an ingest token, once, to its operator (A3)
        - pattern: ^fmt\.Print(|f|ln)$
          msg: no stdout printing — use slog/zap (observability doctrine)
        - pattern: ^log\.(Print|Fatal|Panic)(|f|ln)$
          msg: no stdlib log — errors flow up as values; log only at the final boundary
        - pattern: ^signal\.(Notify|NotifyContext)$
          pkg: ^os/signal$
          msg: only launchstack.go registers the stop signals — a second registration swallows the second SIGTERM (decision 13)
        - pattern: ^time\.(Now|Since|Until)$
          msg: inject a clock port — domain and application time must be deterministic
    gocritic:
      enabled-tags:
        - diagnostic
        - performance

  exclusions:
    generated: strict
    paths:
      - internal/gen
      - web
    rules:
      - path: internal/domain/topology/
        linters:
          - forbidigo
        text: only topology.Builder keeps the expire
      - path: (internal/infrastructure/journaltest/|internal/infrastructure/natsjs/feed/|internal/domain/telemetry/batch/|/[a-z]+test/|_test\.go$)
        linters:
          - forbidigo
        text: only the journals \(journaltest, natsjs/feed\) stamp ReceivedAt
      - path-except: internal/(domain|application)/
        linters:
          - forbidigo
        text: inject a clock port
      - path-except: cmd/faultline/
        linters:
          - forbidigo
        text: only launchstack.go registers the stop signals
      - path: cmd/faultline/launchstack\.go
        linters:
          - forbidigo
        text: only launchstack.go registers the stop signals
      - path: (_test\.go$|internal/infrastructure/natsjs/checkpoint/)
        linters:
          - forbidigo
        text: the checkpoint store translates its errors
      - path-except: internal/infrastructure/natsjs/tokens/
        linters:
          - forbidigo
        text: natsjs/tokens reads raw API codes
      - path: _test\.go$
        linters:
          - forbidigo
        text: natsjs/tokens reads raw API codes
      - path-except: (internal/domain/credential/|internal/application/tokenadmin/|internal/application/ingestauth/)
        linters:
          - forbidigo
        text: digests and secrets compare only through Digest.Equal
      - path: _test\.go$
        linters:
          - forbidigo
        text: digests and secrets compare only through Digest.Equal
      - path: (_test\.go$|cmd/faultline/tokenoutput\.go$)
        linters:
          - forbidigo
        text: only cmd/faultline/tokenoutput.go reveals an ingest token
      - path: (_test\.go$|/[a-z]+test/|^test/|^hack/)
        linters:
          - wrapcheck
      - path: (_test\.go$|/[a-z]+test/)
        linters:
          - gocritic
        text: hugeParam
      - path: _test\.go
        linters:
          - funlen
          - gocognit
          - gocyclo
          - prealloc
          - gosec
          - err113
          - mnd

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/DmytroLysenko1/faultline
