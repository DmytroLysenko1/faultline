name: stress

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stress-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-stress:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Race stress
        run: |
          set -o pipefail
          make test-stress 2>&1 | tee stress.log

      - name: Stress log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stress-log
          path: stress.log
          retention-days: 14
