apiVersion: apps/v1
kind: Deployment
metadata:
  name: faultline
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: faultline
  template:
    metadata:
      labels:
        app.kubernetes.io/name: faultline
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 25
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: faultline
          image: faultline:dev
          imagePullPolicy: Never
          env:
            - name: OTLP_GRPC_ADDR
              value: 0.0.0.0:4317
            - name: API_ADDR
              value: 0.0.0.0:8080
            - name: GOMEMLIMIT
              value: 1632MiB
            - name: NATS_URL
              value: nats://nats:4222
            - name: CHECKPOINT_DIR
              value: /spool
            - name: PARTITIONS
              value: "1"
            - name: STREAM_MAX_BYTES
              value: 2GiB
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: spool
              mountPath: /spool
      volumes:
        - name: spool
          emptyDir:
            sizeLimit: 512Mi
