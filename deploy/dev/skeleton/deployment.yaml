apiVersion: apps/v1
kind: Deployment
metadata:
  name: faultline
spec:
  replicas: 1
  strategy:
    type: Recreate
  template:
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: faultline
          image: faultline:dev
          imagePullPolicy: Never
          env:
            - name: FAULTLINE_OTLP_GRPC_ADDR
              value: 0.0.0.0:4317
            - name: FAULTLINE_API_ADDR
              value: 0.0.0.0:8080
            - name: GOMEMLIMIT
              value: 1600MiB
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
