apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: faultline
labels:
  - pairs:
      app.kubernetes.io/part-of: faultline
    includeSelectors: true
resources:
  - namespace.yaml
  - nats.yaml
  - deployment.yaml
  - service.yaml
configMapGenerator:
  - name: nats-config
    files:
      - nats.conf
