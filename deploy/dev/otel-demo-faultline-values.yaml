opentelemetry-collector:
  extraEnvs:
    - name: INGEST_TOKEN
      valueFrom:
        secretKeyRef:
          name: ingest-token
          key: token
  config:
    exporters:
      otlp_grpc/faultline:
        endpoint: faultline.faultline.svc:4317
        tls:
          insecure: true
        timeout: 5s
        headers:
          authorization: Bearer ${env:INGEST_TOKEN}
        retry_on_failure:
          enabled: true
        sending_queue:
          enabled: true
          num_consumers: 10
    service:
      pipelines:
        traces:
          exporters: [debug, otlp_grpc/faultline]
