opentelemetry-collector:
  securityContext:
    runAsUser: 0
    runAsGroup: 0
  extraVolumes:
    - name: capture
      hostPath:
        path: /var/lib/faultline-capture
        type: DirectoryOrCreate
  extraVolumeMounts:
    - name: capture
      mountPath: /capture
  resources:
    limits:
      memory: 600Mi
  config:
    exporters:
      file/traces:
        path: /capture/traces.jsonl
        format: json
        flush_interval: 1s
      file/servicegraph:
        path: /capture/servicegraph.jsonl
        format: json
        flush_interval: 1s
    connectors:
      servicegraph:
        store:
          ttl: 10s
          max_items: 100000
        metrics_flush_interval: 30s
    service:
      pipelines:
        traces:
          exporters: [debug, file/traces, servicegraph]
        metrics/servicegraph:
          receivers: [servicegraph]
          exporters: [file/servicegraph]
