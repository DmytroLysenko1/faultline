jaeger:
  enabled: false
prometheus:
  enabled: false
grafana:
  enabled: false
opensearch:
  enabled: false

components:
  load-generator:
    envOverrides:
      - name: LOCUST_BROWSER_TRAFFIC_ENABLED
        value: "false"

opentelemetry-collector:
  config:
    processors:
      k8s_attributes:
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
          - sources:
              - from: connection
          - sources:
              - from: resource_attribute
                name: container.id
    service:
      pipelines:
        traces:
          exporters: [debug]
        metrics:
          receivers: [otlp, kafkametrics, prometheus/ad]
          exporters: [debug]
        logs:
          exporters: [debug]
